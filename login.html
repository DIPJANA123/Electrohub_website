<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ElectroHub</title>
  <style>
    body { font-family: Arial, sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; background:#f5f5f5; }
    .login-box { background:#fff; padding:2rem; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.2); width:300px; text-align:center; }
    input { width:100%; padding:0.7rem; margin:0.5rem 0; border:1px solid #ccc; border-radius:5px; }
    button { padding:0.7rem; width:100%; border:none; border-radius:5px; margin-top:0.5rem; cursor:pointer; background:#0B6AF5; color:#fff; font-size:1rem; }
    button:hover { background:#084bb8; }
    .logout-btn { background:#dc3545; }
    .logout-btn:hover { background:#b02a37; }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login / Signup</h2>
    <div id="loginForm">
      <input type="text" id="username" placeholder="Enter Username" required>
      <input type="password" id="password" placeholder="Enter Password" required>
      <button onclick="login()">Login</button>
    </div>

    <div id="welcomeBox" style="display:none;">
      <h3 id="welcomeMsg"></h3>
      <button onclick="goToOrder()">Continue to Order</button>
      <!-- <button class="logout-btn" onclick="logout()">Logout</button> -->
    </div>
  </div>

  <script>
    // Page load check
    window.onload = function() {
      const user = localStorage.getItem("user");
      if(user){
        showWelcome(user);
      }
    }

    function login(){
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if(username && password){
        // save user login info in localStorage
        localStorage.setItem("user", username);
        showWelcome(username);
      } else {
        alert("❌ Please fill all fields!");
      }
    }

    function showWelcome(username){
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("welcomeBox").style.display = "block";
      document.getElementById("welcomeMsg").innerText = "Welcome, " + username + "!";
    }

    function goToOrder(){
      window.location.href = "order.html"; // next page (checkout/order)
    }

    function logout(){
      localStorage.removeItem("user");
      document.getElementById("loginForm").style.display = "block";
      document.getElementById("welcomeBox").style.display = "none";
    }
  </script>

</body>
</html>
