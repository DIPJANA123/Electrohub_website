<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceiling Fan - ElectroHub</title>
  <link rel="stylesheet" href="homepage.css">
  <style>
    .product-details {
      padding: 2rem;
      text-align: center;
    }
    .product-details img {
      width: 250px;
      height: auto;
      border-radius: 10px;
      margin-bottom: 1rem;
    }
    .product-details h2 { margin: 0.5rem 0; }
    .product-details p { color: #555; margin-bottom: 1rem; }
    .product-details h3 { color: #0B6AF5; margin-bottom: 1rem; }

    .product-details button {
      padding: 0.7rem 1.2rem;
      margin: 0.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
    .add-cart {
      background: #0B6AF5;
      color: white;
    }
    .order-now {
      background: #28a745;
      color: white;
    }
    .add-cart:hover { background: #084bb8; }
    .order-now:hover { background: #1e7e34; }
  </style>
</head>
<body>

  <header>Ceiling Fan</header>

  <section class="product-details">
    <img src="https://via.placeholder.com/250" alt="Ceiling Fan">
    <h2>Ceiling Fan</h2>
    <p>High-speed ceiling fan, energy efficient, perfect for homes and offices.</p>
    <h3>Price: ₹1200</h3>
    
    <!-- Buttons -->
    <button class="add-cart" onclick="addToCart()">Add to Cart</button>
    <button class="order-now" onclick="placeOrder()">Order Now</button>
  </section>

  <nav class="bottom-nav">
    <button onclick="location.href='index.html'">🏠 Home</button>
    <button onclick="alert('Seller Section')">🛍 Seller</button>
    <button onclick="alert('Account Section')">👤 Account</button>
    <button onclick="alert('View Cart')">🛒 Cart</button>
  </nav>

  <script>
    function addToCart() {
      alert("✅ Product added to cart!");
    }

    function placeOrder() {
      // link login page
      window.location.href="login.html";
    }
  </script>

</body>
</html>
