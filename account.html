<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Account - ElectroHub</title>
  <link rel="stylesheet" href="homepage.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header { background: #007bff; color: #fff; padding: 15px; text-align: center; font-size: 20px; }
    .account-container { padding: 20px; }
    .section { margin-bottom: 20px; border: 1px solid #ccc; border-radius: 10px; padding: 15px; }
    .section h2 { margin-top: 0; }
    .logout-btn { background: red; color: #fff; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

  <header>👤 My Account</header>

  <div class="account-container">
    <!-- Profile -->
    <div class="section">
      <h2>👤 My Profile</h2>
      <p><b>Name:</b> <span id="userName"></span></p>
      <p><b>Email:</b> <span id="userEmail"></span></p>
      <p><b>Phone:</b> <span id="userPhone"></span></p>
      <p><b>Address:</b> <span id="userAddress"></span></p>
    </div>

    <!-- Orders -->
    <div class="section">
      <h2>📦 My Orders</h2>
      <ul id="myOrders">
        <li>No orders yet.</li>
      </ul>
    </div>

    <!-- Wishlist -->
    <div class="section">
      <h2>❤️ My Wishlist</h2>
      <ul id="myWishlist">
        <li>No wishlist items.</li>
      </ul>
    </div>

    <!-- Notifications -->
    <div class="section">
      <h2>🔔 Notifications</h2>
      <ul id="myNotifications">
        <li>No new notifications.</li>
      </ul>
    </div>

    <!-- Logout -->
    <div class="section">
      <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <button onclick="location.href='index.html'">🏠 Home</button>
    <button onclick="location.href='seller.html'">🛍 Seller</button>
    <button onclick="location.href='account.html'">👤 Account</button>
    <button onclick="alert('View Cart')">🛒 Cart</button>
  </nav>

  <script>
    // Fetch user data from localStorage (from signup/login page)
    const user = JSON.parse(localStorage.getItem("user"));

    if (!user) {
      // Agar login nahi hai toh login page bhej do
      window.location.href = "login.html";
    } else {
      // Show user details
      document.getElementById("userName").innerText = user.name || "Unknown";
      document.getElementById("userEmail").innerText = user.email || "Not Provided";
      document.getElementById("userPhone").innerText = user.phone || "Not Provided";
      document.getElementById("userAddress").innerText = user.address || "Not Provided";
    }

    // Orders from localStorage
    const orders = JSON.parse(localStorage.getItem("orders")) || [];
    const orderList = document.getElementById("myOrders");
    orderList.innerHTML = "";
    if (orders.length > 0) {
      orders.forEach(o => {
        let li = document.createElement("li");
        li.textContent = `${o.productName} - ${o.date}`;
        orderList.appendChild(li);
      });
    } else {
      orderList.innerHTML = "<li>No orders yet.</li>";
    }

    // Wishlist
    const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
    const wishlistList = document.getElementById("myWishlist");
    wishlistList.innerHTML = "";
    if (wishlist.length > 0) {
      wishlist.forEach(w => {
        let li = document.createElement("li");
        li.textContent = w;
        wishlistList.appendChild(li);
      });
    } else {
      wishlistList.innerHTML = "<li>No wishlist items.</li>";
    }

    // Notifications (dummy for now)
    const notifications = JSON.parse(localStorage.getItem("notifications")) || [];
    const notifList = document.getElementById("myNotifications");
    notifList.innerHTML = "";
    if (notifications.length > 0) {
      notifications.forEach(n => {
        let li = document.createElement("li");
        li.textContent = n;
        notifList.appendChild(li);
      });
    } else {
      notifList.innerHTML = "<li>No new notifications.</li>";
    }

    function logout() {
      localStorage.removeItem("user");
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
