<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seller Dashboard - ElectroHub</title>
  <style>
    body{font-family:Arial, sans-serif; margin:0; background:#f6f7fb;}
    header{background:#0B6AF5;color:#fff;padding:12px 16px;}
    .container{max-width:960px;margin:18px auto;padding:12px;}
    .card{background:#fff;padding:12px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.06);margin-bottom:12px;}
    label{display:block;margin:6px 0 4px;font-weight:600;}
    input, textarea, select {width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;}
    .row{display:flex;gap:12px;flex-wrap:wrap;}
    .col-2{flex:1 1 48%;}
    button{padding:8px 12px;border:none;border-radius:6px;background:#0B6AF5;color:#fff;cursor:pointer;}
    .danger{background:#dc3545;}
    img.thumb{width:120px;border-radius:6px;display:block;margin-top:8px;}
    .product-grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;}
    .prod{width:200px;background:#fff;padding:8px;border-radius:8px;border:1px solid #eee;}
    .small{font-size:13px;color:#555;}
  </style>
</head>
<body>
  <header>
    <div style="max-width:960px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;">
      <div>ElectroHub — Seller Dashboard</div>
      <div>
        <button onclick="logout()" style="background:#fff;color:#0B6AF5;border-radius:6px;padding:6px 10px;">Logout</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="card" id="profileCard">
      <h3>Seller Info</h3>
      <div id="sellerInfo" class="small"></div>
    </div>

    <div class="card">
      <h3>Add Product to Sell</h3>
      <label>Product Title</label>
      <input id="p_title" placeholder="eg. 10kΩ Resistor (Pack of 10)" />
      <div class="row">
        <div class="col-2">
          <label>Price (₹)</label>
          <input id="p_price" type="number" />
        </div>
        <div class="col-2">
          <label>Stock</label>
          <input id="p_stock" type="number" value="10" />
        </div>
      </div>
      <label>Description</label>
      <textarea id="p_desc" rows="3"></textarea>

      <label>Image (upload or paste image URL)</label>
      <input id="p_img_url" placeholder="https://..." />
      <input id="p_img_file" type="file" accept="image/*" />
      <img id="preview" class="thumb" style="display:none;" />

      <div style="margin-top:8px;"><button onclick="addProduct()">Add Product</button></div>
    </div>

    <div class="card">
      <h3>Your Products</h3>
      <div id="productsArea" class="product-grid"></div>
      <div id="noProducts" class="small" style="display:none;">No products yet. Add from above form.</div>
    </div>
  </div>

  <script>
    // ensure seller logged in
    const seller = JSON.parse(localStorage.getItem('seller') || 'null');
    if(!seller){
      alert('Please login as seller first.');
      window.location.href = 'seller.html';
    }

    // show seller info
    document.getElementById('sellerInfo').innerHTML = `
      <strong>${seller.name}</strong> — ${seller.shop} <br>
      Phone: ${seller.phone} <br>
      ${seller.email ? 'Email: ' + seller.email + '<br>' : '' }
      ${seller.address ? seller.address + '<br>' : ''}
    `;

    // image preview on file select
    document.getElementById('p_img_file').addEventListener('change', function(e){
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(ev){
        document.getElementById('preview').src = ev.target.result;
        document.getElementById('preview').style.display = 'block';
        // also copy data url into p_img_url so saved image available
        document.getElementById('p_img_url').value = ev.target.result;
      }
      reader.readAsDataURL(file);
    });

    // load seller products from localStorage (key: sellerProducts_<seller.id>)
    const storageKey = 'sellerProducts_' + seller.id;
    let myProducts = JSON.parse(localStorage.getItem(storageKey) || '[]');

    function renderProducts(){
      const area = document.getElementById('productsArea'); area.innerHTML = '';
      if(myProducts.length === 0){
        document.getElementById('noProducts').style.display = 'block';
      } else {
        document.getElementById('noProducts').style.display = 'none';
        myProducts.forEach((p, idx) => {
          const el = document.createElement('div');
          el.className = 'prod';
          el.innerHTML = `
            <img src="${p.img || 'https://via.placeholder.com/150'}" style="width:100%;height:110px;object-fit:cover;border-radius:6px;" />
            <h4 style="margin:8px 0 4px;">${p.title}</h4>
            <div class="small">₹${p.price} · Stock: ${p.stock}</div>
            <div style="margin-top:8px;">
              <button onclick="editProduct(${idx})" style="margin-right:6px;background:#ffc107;color:#000;padding:6px;border-radius:6px;">Edit</button>
              <button onclick="deleteProduct(${idx})" style="background:#dc3545;" class="danger">Delete</button>
            </div>
          `;
          area.appendChild(el);
        });
      }
    }

    function addProduct(){
      const title = document.getElementById('p_title').value.trim();
      const price = document.getElementById('p_price').value;
      const stock = document.getElementById('p_stock').value;
      const desc = document.getElementById('p_desc').value.trim();
      const img = document.getElementById('p_img_url').value.trim();

      if(!title || !price){ alert('Please provide title and price'); return; }

      const p = { id: 'p_' + Date.now(), title, price: Number(price), stock: Number(stock), desc, img };
      myProducts.push(p);
      localStorage.setItem(storageKey, JSON.stringify(myProducts));
      // clear form
      document.getElementById('p_title').value=''; document.getElementById('p_price').value=''; document.getElementById('p_stock').value='10';
      document.getElementById('p_desc').value=''; document.getElementById('p_img_url').value=''; document.getElementById('preview').style.display='none';
      renderProducts();
      alert('Product added');
    }

    function deleteProduct(idx){
      if(!confirm('Delete this product?')) return;
      myProducts.splice(idx,1);
      localStorage.setItem(storageKey, JSON.stringify(myProducts));
      renderProducts();
    }

    function editProduct(idx){
      const p = myProducts[idx];
      // fill form with product data for editing (simple replace on add)
      document.getElementById('p_title').value = p.title;
      document.getElementById('p_price').value = p.price;
      document.getElementById('p_stock').value = p.stock;
      document.getElementById('p_desc').value = p.desc;
      document.getElementById('p_img_url').value = p.img;
      if(p.img) { document.getElementById('preview').src = p.img; document.getElementById('preview').style.display = 'block'; }
      // remove existing product and let seller click Add to save updated (simple flow)
      myProducts.splice(idx,1);
      localStorage.setItem(storageKey, JSON.stringify(myProducts));
      renderProducts();
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function logout(){
      if(confirm('Logout?')) {
        localStorage.removeItem('seller');
        window.location.href = 'seller.html';
      }
    }

    // initial render
    renderProducts();

  </script>
</body>
</html>
