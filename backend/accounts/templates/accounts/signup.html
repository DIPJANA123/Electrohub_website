{% extends 'shop/base.html' %}
{% load static %}

{% block title %}
Customer Signup
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'accounts/css/signup.css' %}">
{% endblock %}

{% block content %}

<div class="signup-container">

    <h2>Create Customer Account</h2>

    <form method="POST">

        {% csrf_token %}

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <input type="text"
               name="name"
               placeholder="Full Name"
               required>

        <input type="email"
               name="email"
               placeholder="Email Address"
               required>

        <input type="text"
               name="phone"
               placeholder="Phone Number"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">
            Create Account
        </button>

    </form>

</div>

{% endblock %}
