<!DOCTYPE html>
<html>
<head>
  <title>Login - ElectroHub</title>
  <style>
    body{font-family:Arial;background:#f4f6fb;}
    .box{width:350px;margin:60px auto;background:white;padding:20px;border-radius:10px;box-shadow:0 0 10px #ccc;}
    h2{text-align:center;color:#28a745;}
    input,button{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:1px solid #ccc;}
    button{background:#28a745;color:white;font-weight:bold;}
  </style>
</head>
<body>

<div class="box">
  <h2>Login</h2>
  <form method="POST">
    {% csrf_token %}
   <input type="email" name="username" placeholder="Email" required>
   <input type="password" name="password" placeholder="Password" required>
    <button>Login</button>
  </form>
  <p align="center">No account? <a href="/users/signup/">Create one</a></p>
</div>

</body>
</html>
