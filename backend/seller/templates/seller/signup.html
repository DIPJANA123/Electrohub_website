{% extends 'shop/base.html' %}
{% load static %}

{% block title %}
Seller Signup
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'seller/css/seller_signup.css' %}">
{% endblock %}

{% block content %}

<div class="seller-signup-container">

<h2>🛍 Seller Signup</h2>

<h2>Seller Signup</h2>

{% if error %}
<p class="error-message">{{ error }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <input type="text" name="shop_name" placeholder="Shop Name" required><br><br>

    <input type="text" name="owner_name" placeholder="Owner Name" required><br><br>

    <input type="email" name="email" placeholder="Email" required><br><br>

    <input type="text" name="phone" placeholder="Phone Number" required><br><br>

    <input type="password" name="password" placeholder="Password" required><br><br>

    <button type="submit">Create Seller Account</button>

</form>

<br>

<a href="{% url 'seller_login' %}">Already have an account? Login</a>

</div>

{% endblock %}
